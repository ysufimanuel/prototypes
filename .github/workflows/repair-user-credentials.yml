name: Repair user email and password management

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch user management
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # firebase.js: patch ONLY updateChurchUser, not createChurchUser.
          p = Path('js/firebase.js')
          s = p.read_text()
          start = s.index('async function updateChurchUser')
          end = s.index('async function deleteChurchUser', start)
          block = s[start:end]
          if '...(userData.password ? { password: userData.password } : {})' not in block:
              old = '          role: userData.role,\n          churchId: _activeChurchId,'
              new = '          role: userData.role,\n          ...(userData.password ? { password: userData.password } : {}),\n          churchId: _activeChurchId,'
              if old not in block:
                  raise SystemExit('firebase.js updateChurchUser payload target not found')
              block = block.replace(old, new, 1)
              s = s[:start] + block + s[end:]
              p.write_text(s)

          # app.js: include password from the edit modal only when supplied.
          p = Path('js/app.js')
          s = p.read_text()
          old = '''      const updatedProfile = {\n        nama,\n        username: username || email.split("@")[0],\n        email,\n        role,\n      };'''
          new = '''      const updatedProfile = {\n        nama,\n        username: username || email.split("@")[0],\n        email,\n        role,\n        ...(password ? { password } : {}),\n      };'''
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)

          # API: accept password and update Firebase Auth without storing it in Firestore.
          p = Path('api/admin/users/[uid].js')
          s = p.read_text()
          if 'const { nama, username, email, role, password }' not in s:
              s = s.replace(
                  '    const { nama, username, email, role } = req.body || {};',
                  '    const { nama, username, email, role, password } = req.body || {};',
                  1,
              )
          if 'if (password) authUpdate.password = String(password);' not in s:
              old = '''    const authUpdate = {};\n    if (nama) authUpdate.displayName = nama;\n    if (email) authUpdate.email = email;\n    if (Object.keys(authUpdate).length) await auth.updateUser(uid, authUpdate);'''
              new = '''    if (password !== undefined && password !== "" && String(password).length < 6) {\n      return res.status(400).json({ success: false, message: "Password minimal 6 karakter." });\n    }\n\n    const authUpdate = {};\n    if (nama) authUpdate.displayName = nama;\n    if (email) authUpdate.email = email;\n    if (password) authUpdate.password = String(password);\n    if (Object.keys(authUpdate).length) await auth.updateUser(uid, authUpdate);'''
              if old not in s:
                  raise SystemExit('api authUpdate target not found')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/firebase.js js/app.js 'api/admin/users/[uid].js'
          git diff --cached --quiet && exit 0
          git commit -m "fix: allow super admin to update user email and password"
          git push
