name: Repair user email and password management

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch user management
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # firebase.js: forward optional password to the Vercel API.
          p = Path('js/firebase.js')
          s = p.read_text()
          old = '''          role: userData.role,\n          churchId: _activeChurchId,'''
          new = '''          role: userData.role,\n          ...(userData.password ? { password: userData.password } : {}),\n          churchId: _activeChurchId,'''
          if old not in s:
              raise SystemExit('firebase.js target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # app.js: include the password entered in the edit modal, but only when non-empty.
          p = Path('js/app.js')
          s = p.read_text()
          old = '''      const updatedProfile = {\n        nama,\n        username: username || email.split("@")[0],\n        email,\n        role,\n      };'''
          new = '''      const updatedProfile = {\n        nama,\n        username: username || email.split("@")[0],\n        email,\n        role,\n        ...(password ? { password } : {}),\n      };'''
          if old not in s:
              raise SystemExit('app.js target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # API: use Firebase Admin SDK to update another user's email/password.
          p = Path('api/admin/users/[uid].js')
          s = p.read_text()
          old = '    const { nama, username, email, role } = req.body || {};'
          new = '    const { nama, username, email, role, password } = req.body || {};'
          if old not in s:
              raise SystemExit('api users destructuring target not found')
          s = s.replace(old, new, 1)

          old = '''    const authUpdate = {};\n    if (nama) authUpdate.displayName = nama;\n    if (email) authUpdate.email = email;\n    if (Object.keys(authUpdate).length) await auth.updateUser(uid, authUpdate);'''
          new = '''    if (password !== undefined && password !== "" && String(password).length < 6) {\n      return res.status(400).json({ success: false, message: "Password minimal 6 karakter." });\n    }\n\n    const authUpdate = {};\n    if (nama) authUpdate.displayName = nama;\n    if (email) authUpdate.email = email;\n    if (password) authUpdate.password = String(password);\n    if (Object.keys(authUpdate).length) await auth.updateUser(uid, authUpdate);'''
          if old not in s:
              raise SystemExit('api authUpdate target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/firebase.js js/app.js 'api/admin/users/[uid].js'
          git diff --cached --quiet && exit 0
          git commit -m "fix: allow super admin to update user email and password"
          git push
